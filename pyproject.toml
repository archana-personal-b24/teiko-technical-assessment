[project]
name = "teiko-cell-analysis"
version = "1.0.0"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=teiko --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:dash.*",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"app.py" = ["S104"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
