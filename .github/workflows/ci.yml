name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: make setup
      - run: make check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t teiko-cell-analysis .
      - name: Smoke-test production container
        run: |
          test "$(docker run --rm --entrypoint id teiko-cell-analysis -u)" = "10001"
          docker run --rm --entrypoint sh teiko-cell-analysis -c 'test ! -e /app/cell-count.csv'
          docker run --detach --name teiko-dashboard --publish 8050:8050 teiko-cell-analysis
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8050/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs teiko-dashboard
          exit 1
